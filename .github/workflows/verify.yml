name: verify

# Capability 4 (Verify & Recover) and Capability 5 (Complete).
# Verification is a stage of the loop, not an afterthought. Every acceptance
# criterion maps to a concrete, machine-checkable signal, and the loop physically
# cannot declare itself Complete while any acceptance box remains unchecked.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify — lint, unit, integration, contract, a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint HTML
        run: npm run lint

      - name: Verify content, integration, layout fixtures and accessibility
        run: npm test

  done-condition:
    name: Complete — done-condition (hard gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to pass while any acceptance box is unchecked
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Count acceptance checklist boxes in the PR body.
            const unchecked = (body.match(/- \[ \]/g) || []).length;
            const checked   = (body.match(/- \[[xX]\]/g) || []).length;

            core.info(`done-condition: ${checked} checked, ${unchecked} unchecked.`);

            if (checked === 0) {
              core.setFailed(
                "No acceptance checklist found in the PR body. " +
                "Add the acceptance criteria (each linking to evidence)."
              );
              return;
            }
            if (unchecked > 0) {
              core.setFailed(
                `Done-condition not met: ${unchecked} acceptance criteria still ` +
                `unchecked. "PR opened" is not "done" — check each box with a link ` +
                `to a passing test.`
              );
            }
